services:
  postgres:
    image: postgres:17
    container_name: clothify-postgres
    restart: unless-stopped

    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: clothify

    ports:
      - "5432:5432"

    volumes:
      - clothify-postgres-data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d clothify"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  clothify-postgres-data: